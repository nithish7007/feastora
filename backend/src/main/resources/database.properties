# FEASTORA Database Configuration
# Supports standard MySQL 8+ installation or custom environment variables
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/feastora_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
db.username=root
db.password=root

# HikariCP Connection Pool Settings
db.pool.maximumPoolSize=20
db.pool.minimumIdle=5
db.pool.idleTimeout=300000
db.pool.connectionTimeout=20000
db.pool.maxLifetime=1200000
